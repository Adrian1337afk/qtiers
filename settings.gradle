pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'qtiers'

// One Gradle project per supported Minecraft version; shared code lives in common/
['1.21.11', '1.21.8', '1.21.4', '26.1', '26.2', '26.3'].each { v ->
    include ":${v}"
    project(":${v}").projectDir = file("versions/${v}")
}
