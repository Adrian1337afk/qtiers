pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'qtiers'

// One Gradle project per supported Minecraft version; shared code lives in common/
['1.21.11'].each { v ->
    include ":${v}"
    project(":${v}").projectDir = file("versions/${v}")
}
